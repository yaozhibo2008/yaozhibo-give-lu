<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf3f8">
<title>同桌的碎片日常</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:#f7f1f6;color:#443f52;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;
    background:
      radial-gradient(120% 80% at 10% 0%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(100% 70% at 100% 100%, #fadbe8 0%, rgba(250,219,232,0) 60%),
      linear-gradient(170deg,#fdf7fb 0%,#f8ecf3 55%,#f0e8f7 100%);
  }
  .screen.active{display:flex;}

  /* ---------- 开始页 ---------- */
  #screen-start{align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
  .start-card{
    width:100%;max-width:400px;background:rgba(255,255,255,.84);
    border:1px solid rgba(232,200,218,.55);border-radius:22px;
    padding:30px 24px 26px;box-shadow:0 18px 50px rgba(200,150,180,.18);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    animation:fadeUp .55s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
  .brand{font-size:11px;letter-spacing:.42em;color:#c9a3ba;margin-bottom:12px;}
  .start-card h1{font-size:27px;font-weight:700;letter-spacing:.06em;color:#453a4d;margin-bottom:8px;}
  .start-card h1 span{color:#d489aa;}
  .sub{font-size:12.5px;line-height:1.9;color:#a895a5;margin-bottom:24px;}
  .lbl{display:block;font-size:12px;letter-spacing:.16em;color:#b09aab;margin:0 0 9px 2px;}
  #input-name{
    width:100%;padding:14px 16px;font-size:15px;font-family:inherit;color:#443f52;
    background:rgba(255,255,255,.92);border:1.5px solid #ecdfe8;border-radius:14px;
    outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:24px;
  }
  #input-name::placeholder{color:#c5b6c2;}
  #input-name:focus{border-color:#e9a8c4;box-shadow:0 0 0 4px rgba(233,168,196,.18);}
  .gender-row{display:flex;gap:9px;margin-bottom:26px;}
  .gender-btn{
    flex:1;padding:12px 0;font-size:13.5px;font-family:inherit;cursor:pointer;
    background:rgba(255,255,255,.75);border:1.5px solid #ecdfe8;border-radius:13px;
    color:#b09aab;transition:all .2s;
  }
  .gender-btn.on{
    background:linear-gradient(160deg,#efa8c6,#d47fa6);border-color:transparent;
    color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(212,127,166,.32);
  }
  .btn-main{
    width:100%;padding:16px;font-size:15.5px;font-family:inherit;font-weight:600;
    letter-spacing:.12em;color:#fff;cursor:pointer;border:none;border-radius:15px;
    background:linear-gradient(135deg,#efa8c6,#d47fa6);
    box-shadow:0 10px 26px rgba(212,127,166,.32);
    transition:transform .14s,box-shadow .2s;
  }
  .btn-main:active{transform:scale(.975);}
  .btn-ghost{
    width:100%;margin-top:11px;padding:14px;font-size:13.5px;font-family:inherit;
    cursor:pointer;border-radius:15px;color:#b09aab;
    background:rgba(255,255,255,.65);border:1.5px solid #ece0e9;
    transition:all .2s;
  }
  .btn-ghost:active{background:#f7e9f1;}
  .tip{margin-top:20px;font-size:11px;line-height:1.9;color:#bca9b6;text-align:center;}

  /* ---------- 游戏页 ---------- */
  #screen-game{display:none;}
  #screen-game.active{display:flex;}

  .status{
    flex:0 0 auto;padding:12px 14px 10px;
    background:rgba(255,255,255,.74);
    border-bottom:1px solid rgba(226,196,214,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .stats{display:flex;gap:10px;}
  .stat{flex:1;min-width:0;position:relative;}
  .stat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
  .stat-name{font-size:10.5px;letter-spacing:.08em;color:#ab98a8;}
  .stat-val{font-size:12px;font-weight:700;color:#7a5f72;}
  /* 数值飘字：只在结算瞬间出现 0.8s。右边界由 JS 按数字实际左缘算出，
     保证永远落在「属性名」与「数字」之间的空隙里，不压住数字。 */
  .stat-float{
    position:absolute;right:0;top:-1px;
    font-size:11px;font-weight:700;letter-spacing:.02em;
    pointer-events:none;user-select:none;white-space:nowrap;
    animation:floatUp .8s cubic-bezier(.25,.8,.4,1) forwards;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(3px);}
    20%{opacity:1;transform:translateY(0);}
    68%{opacity:1;transform:translateY(-6px);}
    100%{opacity:0;transform:translateY(-11px);}
  }
  @media (prefers-reduced-motion:reduce){
    .stat-float{animation-duration:.01ms;}
  }
  .track{height:5px;border-radius:99px;background:#f4e6ee;overflow:hidden;}
  .fill{height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(.3,.9,.3,1);}
  #fill-share{background:linear-gradient(90deg,#f7b8ce,#ec8fb4);}
  #fill-care{background:linear-gradient(90deg,#9fd6c4,#5fbfa3);}
  #fill-pat{background:linear-gradient(90deg,#b8aede,#8a7fc0);}

  .toolbar{display:flex;gap:7px;justify-content:flex-end;margin-top:9px;}
  .toolbar button{
    padding:6px 14px;font-size:11.5px;font-family:inherit;cursor:pointer;
    border-radius:99px;color:#a48fa0;background:rgba(255,255,255,.88);
    border:1px solid #ece0e9;transition:all .18s;
  }
  .toolbar button:active{background:#f7e4ef;color:#b96e92;}

  .log{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 16px 8px;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  }
  .msg{margin-bottom:15px;animation:msgIn .35s ease both;}
  @keyframes msgIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .speaker{
    display:inline-block;font-size:11.5px;letter-spacing:.1em;color:#d489aa;
    padding:2px 0;margin-bottom:5px;font-weight:600;
  }
  .speaker::before{content:"—— ";}
  .speaker-player{color:#b3a3b8;}
  .line{
    font-size:15px;line-height:1.95;color:#4a4253;word-break:break-word;
    letter-spacing:.01em;
  }
  .msg-narration .line{color:#8a8194;font-size:14.5px;}
  .msg-dialog .line{color:#443c51;}
  .msg-player{text-align:right;}
  .msg-player .line{color:#8a7b8c;font-style:italic;}

  .choices{
    flex:0 0 auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:9px;
    background:linear-gradient(to top,rgba(252,244,249,.98) 55%,rgba(252,244,249,0));
  }
  .choices:empty{display:none;}
  .choice{
    width:100%;text-align:left;padding:14px 16px;font-size:14px;line-height:1.6;
    font-family:inherit;color:#4a4253;cursor:pointer;
    background:rgba(255,255,255,.94);border:1.5px solid #ecdfe8;border-radius:14px;
    box-shadow:0 3px 10px rgba(200,160,185,.10);
    transition:transform .14s,background .2s,border-color .2s,box-shadow .2s;
    animation:chIn .32s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes chIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .choice:active{
    transform:scale(.985);background:#fbeaf3;border-color:#e9a8c4;
    box-shadow:0 2px 6px rgba(200,160,185,.2);
  }
  .choice::before{content:"▸ ";color:#e2afc6;}

  /* ---------- 结局页 ---------- */
  #screen-end{align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
  .end-card{
    width:100%;max-width:420px;background:rgba(255,255,255,.88);
    border:1px solid rgba(232,200,218,.55);border-radius:22px;
    padding:32px 24px 26px;box-shadow:0 18px 50px rgba(200,150,180,.18);
    text-align:center;animation:fadeUp .6s cubic-bezier(.2,.8,.3,1) both;
  }
  .end-tag{font-size:10.5px;letter-spacing:.5em;color:#d3b5c7;margin-bottom:14px;}
  .end-card h2{font-size:24px;letter-spacing:.1em;color:#453a4d;margin-bottom:20px;}
  .end-text{font-size:14px;line-height:2.05;color:#5a4f62;text-align:left;margin-bottom:24px;}
  .end-text p{margin-bottom:12px;}
  .end-stats{
    display:flex;justify-content:center;gap:22px;margin-bottom:26px;
    padding-top:18px;border-top:1px dashed #ecdbe6;
  }
  .end-stat{font-size:11px;letter-spacing:.08em;color:#bca9b6;}
  .end-stat b{display:block;font-size:19px;color:#d489aa;margin-top:5px;font-weight:700;}

  .scene-title{
    margin:0 0 16px;padding:0 0 10px;text-align:center;
    font-size:11.5px;letter-spacing:.22em;color:#c9a3ba;font-weight:600;
    border-bottom:1px dashed #ecdbe6;
    animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both;
  }

  /* ---------- 其他 ---------- */
  #toast{
    position:fixed;left:50%;bottom:14%;transform:translate(-50%,8px);
    padding:9px 20px;border-radius:99px;font-size:13px;font-weight:600;
    background:rgba(212,127,166,.95);color:#fff;white-space:nowrap;
    opacity:0;pointer-events:none;transition:all .28s ease;z-index:99;
    box-shadow:0 8px 22px rgba(190,120,155,.3);
  }
  #toast.on{opacity:1;transform:translate(-50%,0);}

  .log::-webkit-scrollbar{width:4px;}
  .log::-webkit-scrollbar-thumb{background:#edd7e4;border-radius:99px;}

  @media (max-width:360px){
    .start-card h1{font-size:23px;}
    .line{font-size:14px;}
    .choice{font-size:13px;padding:12px 14px;}
    .toolbar button{padding:6px 11px;font-size:11px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 开始页 ===== -->
  <section id="screen-start" class="screen active">
    <div class="start-card">
      <div class="brand">2022级 · 同桌</div>
      <h1>同桌<span>的碎片日常</span></h1>
      <p class="sub">她状态起伏不定，兴致上来就爱说笑，累了便独自沉默。<br>草稿纸上，悄悄记下和你有关的片段。</p>

      <label class="lbl">你的名字</label>
      <input id="input-name" type="text" maxlength="10" placeholder="请输入你的名字" autocomplete="off">

      <label class="lbl">你的性别</label>
      <div class="gender-row" id="gender-row">
        <button type="button" class="gender-btn" data-g="男">男</button>
        <button type="button" class="gender-btn on" data-g="女">女</button>
        <button type="button" class="gender-btn" data-g="其他">其他</button>
      </div>

      <button id="btn-start" class="btn-main">开始游戏</button>
      <button id="btn-continue" class="btn-ghost" style="display:none;">读取存档</button>

      <p class="tip">分享欲 · 在意值 · 耐心值<br>每日一吵：吸引同桌注意</p>
    </div>
  </section>

  <!-- ===== 游戏页 ===== -->
  <section id="screen-game" class="screen">
    <div class="status">
      <div class="stats">
        <div class="stat">
          <div class="stat-top"><span class="stat-name">分享欲</span><span class="stat-val" id="v-share">15</span></div>
          <div class="track"><div class="fill" id="fill-share"></div></div>
        </div>
        <div class="stat">
          <div class="stat-top"><span class="stat-name">在意值</span><span class="stat-val" id="v-care">56</span></div>
          <div class="track"><div class="fill" id="fill-care"></div></div>
        </div>
        <div class="stat">
          <div class="stat-top"><span class="stat-name">耐心值</span><span class="stat-val" id="v-pat">60</span></div>
          <div class="track"><div class="fill" id="fill-pat"></div></div>
        </div>
      </div>
      <div class="toolbar">
        <button id="btn-save">存档</button>
        <button id="btn-load">读档</button>
        <button id="btn-restart">重新开始</button>
      </div>
    </div>

    <div class="log" id="log"></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- ===== 结局页 ===== -->
  <section id="screen-end" class="screen">
    <div class="end-card">
      <div class="end-tag">E N D I N G</div>
      <h2 id="end-title">结局</h2>
      <div class="end-text" id="end-text"></div>
      <div class="end-stats" id="end-stats"></div>
      <button id="btn-again" class="btn-main">重新开始</button>
    </div>
  </section>

  <div id="toast"></div>
</div>

<!-- 数据层：剧情/数值全部在 story-data.js，由 build_story_data.py 从 story.md 生成 -->
<script src="story-data.js"></script>

<script>
(function () {
  'use strict';

  /* ============================================================
     剧情数据（由 story.md 生成：10 章 / 30 选项 / 4 结局）
     ============================================================ */
  /* ============================================================
     剧情数据（视图层只读引用，请勿在此手写剧情）
       SCENES / ENDINGS 由 story-data.js 提供，
       源头是 story.md，生成脚本是 build_story_data.py。
       改剧情 -> 改 story.md -> 重跑脚本，不要动本文件里的数据。
     ============================================================ */
  if (!window.STORY_DATA) {
    document.body.innerHTML =
      '<p style="padding:28px;line-height:1.9;color:#7a5f72;">' +
      '剧情数据 story-data.js 加载失败。请确认它与 index.html 在同一目录后重新打开。</p>';
    return;
  }
  const SCENES  = STORY_DATA.SCENES;
  const ENDINGS = STORY_DATA.ENDINGS;

  /* ============================================================
     常量 / 状态
     ============================================================ */
  const SAVE_KEY = 'luyangrui_save_v2';
  const LEGACY_KEYS = ['luyangrui_save_v1'];
  const TYPE_SPEED = 24;
  const GAP_MAX = 20;                        /* 兜底容忍缺口（与 balance_check.py 一致） */
  const INIT = { share: 15, care: 56, pat: 60 };
  const ORDER = ['tian', 'nuan', 'yihan', 'shuli'];   /* 判定优先级：甜 > 暖 > 遗憾 > 疏离 */
  /* 四档区间（数值全部照抄文档，一个都不许改）。
     关于 ORDER 与边界，维护时请注意两点：
     ① 四档的分享欲区间互斥（≥70 / 40–69 / 20–39 / ≤19），所以「三项全中」不可能多档并列，
        ORDER 在这里的实际作用是固定遍历顺序 + 兜底层缺口相同时决定归属，而不是在多档间取舍。
     ② 耐心值 = 70 是 甜(40–70) 与 暖(≥70) 的共用边界；此点归哪档由分享欲落在哪一档决定。
        想「调松某一档」就改这里或 INIT/KC/KP，但改完必须重跑 balance_check.py，
        否则四结局分布与示例选项串全部失效。 */
  const ZONES = {
    tian:  [[70, 100], [65, 100], [40, 70]],
    nuan:  [[40, 69], [60, 100], [70, 100]],
    yihan: [[20, 39], [30, 59], [20, 69]],
    shuli: [[0, 19], [0, 29], [0, 19]]
  };

  let state = null;
  let token = 0;
  let skipFlag = false;
  let busy = false;
  let gender = '女';
  let toastTimer = null;

  const el = function (id) { return document.getElementById(id); };
  const screenStart = el('screen-start');
  const screenGame  = el('screen-game');
  const screenEnd   = el('screen-end');
  const logEl       = el('log');
  const choicesEl   = el('choices');

  /* ============================================================
     工具
     ============================================================ */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function fillName(t) { return String(t).replace(/\{name\}/g, state ? state.name : '你'); }
  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showScreen(s) {
    [screenStart, screenGame, screenEnd].forEach(function (n) { n.classList.remove('active'); });
    s.classList.add('active');
  }

  function toast(msg) {
    const t = el('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1500);
  }

  function scrollBottom() {
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ============================================================
     数值
     ============================================================ */
  function renderStats() {
    if (!state) return;
    el('v-share').textContent = state.share;
    el('v-care').textContent  = state.care;
    el('v-pat').textContent   = state.pat;
    el('fill-share').style.width = clamp(state.share, 0, 100) + '%';
    el('fill-care').style.width  = clamp(state.care, 0, 100) + '%';
    el('fill-pat').style.width   = clamp(state.pat, 0, 100) + '%';
  }

  /* ============================================================
     数值飘字：结算瞬间在对应属性右侧浮出 delta，0.8s 后自动移除
     ============================================================ */
  const STAT_ACCENT = { share: '#e0709b', care: '#4fae93', pat: '#7d70b8' };
  const STAT_DOWN = '#a3949f';            /* 负向统一取页面既有的灰紫，不引入新色系 */

  function showStatFloat(ds, dc, dp) {
    [['v-share', 'share', ds], ['v-care', 'care', dc], ['v-pat', 'pat', dp]].forEach(function (p) {
      if (!p[2]) return;
      const node = el(p[0]);
      const host = node && node.closest ? node.closest('.stat') : null;
      if (!host) return;
      const nb = node.getBoundingClientRect();
      const hb = host.getBoundingClientRect();
      const s = document.createElement('span');
      s.className = 'stat-float';
      s.textContent = (p[2] > 0 ? '+' : '') + p[2];
      s.style.color = p[2] > 0 ? STAT_ACCENT[p[1]] : STAT_DOWN;
      /* 右边界停在数字左缘外侧 3px，飘字因此占用「属性名—数字」之间的空隙 */
      s.style.right = Math.max(hb.right - nb.left + 3, 0) + 'px';
      host.appendChild(s);
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 820);
    });
  }

  /* ============================================================
     结局判定：优先级 + 兜底
       ① 三项全中 -> 按 甜 > 暖 > 遗憾 > 疏离 定案
       ② 双项命中且缺口 <= GAP_MAX -> 取缺口最小者
       ③ 兜底 -> 疏离
     ============================================================ */
  function gapOf(v, r) { return v < r[0] ? r[0] - v : (v > r[1] ? v - r[1] : 0); }

  function judgeEnding(share, care, pat) {
    const vals = [share, care, pat];
    for (let i = 0; i < ORDER.length; i++) {
      const k = ORDER[i];
      if (ZONES[k].every(function (r, idx) { return gapOf(vals[idx], r) === 0; })) {
        return { key: k, level: 1 };
      }
    }
    let best = null;
    for (let i = 0; i < ORDER.length; i++) {
      const k = ORDER[i];
      let sat = 0, gap = 0;
      ZONES[k].forEach(function (r, idx) {
        const g = gapOf(vals[idx], r);
        if (g === 0) sat++;
        gap += g;
      });
      if (sat >= 2 && gap <= GAP_MAX && (!best || gap < best.gap)) {
        best = { key: k, gap: gap };
      }
    }
    return best ? { key: best.key, level: 2 } : { key: 'shuli', level: 3 };
  }

  /* ============================================================
     打字机
     ============================================================ */
  function typeMessage(msg, myToken) {
    return new Promise(function (resolve) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + (msg.who ? 'msg-dialog' : 'msg-narration');

      if (msg.who) {
        const s = document.createElement('div');
        s.className = 'speaker';
        s.textContent = msg.who;
        wrap.appendChild(s);
      }
      const p = document.createElement('p');
      p.className = 'line';
      wrap.appendChild(p);

      logEl.appendChild(wrap);
      scrollBottom();

      const full = msg.text;
      let i = 0;
      skipFlag = false;

      function step() {
        if (myToken !== token) { resolve(false); return; }

        if (skipFlag) {
          p.textContent = full;
          scrollBottom();
          resolve(true);
          return;
        }

        if (i >= full.length) { resolve(true); return; }

        i++;
        p.textContent = full.slice(0, i);

        if (i % 3 === 0) scrollBottom();

        setTimeout(step, TYPE_SPEED);
      }
      step();
    });
  }

  function appendPlayerLine(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-player';
    const s = document.createElement('div');
    s.className = 'speaker speaker-player';
    s.textContent = state.name;
    const p = document.createElement('p');
    p.className = 'line';
    p.textContent = text;
    wrap.appendChild(s);
    wrap.appendChild(p);
    logEl.appendChild(wrap);
    scrollBottom();
  }

  /* ============================================================
     流程
     ============================================================ */
  function newState(name, g) {
    return {
      name: name,
      gender: g,
      share: INIT.share,
      care: INIT.care,
      pat: INIT.pat,
      scene: 's1'
    };
  }

  function startGame(name, g) {
    state = newState(name, g);
    token++;
    logEl.innerHTML = '';
    choicesEl.innerHTML = '';
    renderStats();
    showScreen(screenGame);
    playScene('s1');
  }

  function renderSceneTitle(scene) {
    if (!scene.title) return;
    const t = document.createElement('div');
    t.className = 'scene-title';
    t.textContent = scene.title;
    logEl.appendChild(t);
    scrollBottom();
  }

  async function playScene(sceneId) {
    const myToken = ++token;
    const scene = SCENES[sceneId];
    if (!scene) { showEnding(); return; }

    state.scene = sceneId;
    busy = false;
    choicesEl.innerHTML = '';
    logEl.innerHTML = '';
    renderStats();
    saveGame(false);

    renderSceneTitle(scene);
    await sleep(140);
    if (myToken !== token) return;

    for (let i = 0; i < scene.messages.length; i++) {
      const ok = await typeMessage(scene.messages[i], myToken);
      if (!ok || myToken !== token) return;
      await sleep(160);
      if (myToken !== token) return;
    }

    await sleep(180);
    if (myToken !== token) return;

    renderChoices(scene, myToken);
  }

  function renderChoices(scene, myToken) {
    choicesEl.innerHTML = '';
    scene.choices.forEach(function (c, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.style.animationDelay = (i * 70) + 'ms';
      b.textContent = fillName(c.text);
      b.addEventListener('click', function () { pickChoice(scene, c, myToken); });
      choicesEl.appendChild(b);
    });
    setTimeout(scrollBottom, 60);
  }

  async function pickChoice(scene, choice, myToken) {
    if (busy) return;
    if (myToken !== token) return;
    busy = true;

    choicesEl.innerHTML = '';

    appendPlayerLine(fillName(choice.text));

    const ds = choice.ds || 0, dc = choice.dc || 0, dp = choice.dp || 0;
    const prev = { share: state.share, care: state.care, pat: state.pat };
    state.share = clamp(state.share + ds, 0, 100);
    state.care  = clamp(state.care  + dc, 0, 100);
    state.pat   = clamp(state.pat   + dp, 0, 100);
    /* 飘字必须报「实际入账」的量：属性已顶到 0/100 时，clamp 会吃掉一部分 delta，
       例如在意值 95 选 +10 实际只到 100，就该飘 +5 而不是 +10。差值为 0 则不飘。 */
    showStatFloat(state.share - prev.share, state.care - prev.care, state.pat - prev.pat);
    renderStats();

    /* 【存档时机】此处刻意不落盘：本章 delta 已进属性，但玩家还没看完 replies。
       落盘交给 playScene(next) 的第一段——那里同时推进 state.scene 并立即存档，
       于是「磁盘上的 scene 与数值」永远成对：读档最多重播当前章，绝不会剧情断档。
       结算期间 busy 恒为 true，saveGame 会拒绝手动存档，中间态无法被写出去。 */

    await sleep(320);
    if (myToken !== token) return;

    for (let i = 0; i < choice.replies.length; i++) {
      const ok = await typeMessage(choice.replies[i], myToken);
      if (!ok || myToken !== token) return;
      await sleep(150);
      if (myToken !== token) return;
    }

    await sleep(500);                      /* replies 播完后的呼吸停顿，再切章 */
    if (myToken !== token) return;

    if (scene.next) {
      playScene(scene.next);
    } else {
      showEnding();
    }
  }

  /* ============================================================
     结局
     ============================================================ */
  function showEnding() {
    token++;
    busy = true;
    if (state) state.scene = null;      /* 没有待播章节了，存档语义随之失效 */

    const r = judgeEnding(state.share, state.care, state.pat);
    const data = ENDINGS[r.key] || ENDINGS.shuli;

    el('end-title').textContent = data.title;
    el('end-text').innerHTML = data.body.map(function (p) {
      return '<p>' + esc(p) + '</p>';
    }).join('');
    el('end-stats').innerHTML =
      '<div class="end-stat">分享欲<b>' + state.share + '</b></div>' +
      '<div class="end-stat">在意值<b>' + state.care + '</b></div>' +
      '<div class="end-stat">耐心值<b>' + state.pat + '</b></div>';

    clearSave();
    refreshContinue();
    showScreen(screenEnd);
  }

  /* ============================================================
     存档（v2；v1 旧档明确作废）
     ============================================================ */
  function saveGame(manual) {
    if (!state) return;
    /* 终章结算后 scene 置空，没有「待播章节」可指向，任何存档都会破坏语义。 */
    if (!state.scene) {
      if (manual) toast('结局即将结算，无需存档');
      return;
    }
    /* 结算或打字机进行中（busy）禁止落盘：这一刻属性可能已经加过本章 delta，
       而 state.scene 仍是本章 —— 写出去就是可重复结算的中间态。
       自动存档都发生在 playScene 开头（那里已把 busy 置回 false），因此只拦手动存档。 */
    if (busy) {
      if (manual) toast('剧情播放中，稍后会自动存档');
      return;
    }
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      if (manual) toast('已存档');
    } catch (e) {
      if (manual) toast('存档失败');
    }
  }

  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  function purgeLegacy() {
    let found = false;
    LEGACY_KEYS.forEach(function (k) {
      try {
        if (localStorage.getItem(k)) { localStorage.removeItem(k); found = true; }
      } catch (e) {}
    });
    return found;
  }

  function refreshContinue() {
    el('btn-continue').style.display = hasSave() ? 'block' : 'none';
  }

  function loadGame() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (!raw) { toast('没有找到存档'); return; }

    let d;
    try { d = JSON.parse(raw); } catch (e) { toast('存档已损坏，请重新开始'); return; }
    if (!d || !d.scene || !SCENES[d.scene] ||
        typeof d.share !== 'number' || typeof d.care !== 'number' || typeof d.pat !== 'number') {
      clearSave();
      refreshContinue();
      toast('存档不兼容，请重新开始');
      return;
    }

    state = {
      name: d.name || '你',
      gender: d.gender || '女',
      share: clamp(d.share, 0, 100),
      care: clamp(d.care, 0, 100),
      pat: clamp(d.pat, 0, 100),
      scene: d.scene
    };

    showScreen(screenGame);
    renderStats();
    playScene(state.scene);
    toast('已读档');
  }

  /* ============================================================
     事件绑定
     ============================================================ */
  document.querySelectorAll('.gender-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.gender-btn').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      gender = b.dataset.g;
    });
  });

  el('btn-start').addEventListener('click', function () {
    const n = el('input-name').value.trim() || '你';
    startGame(n, gender);
  });

  el('input-name').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el('btn-start').click();
  });

  el('btn-continue').addEventListener('click', loadGame);

  el('btn-save').addEventListener('click', function () {
    if (!state) return;
    saveGame(true);
  });

  el('btn-load').addEventListener('click', function () {
    if (!hasSave()) { toast('没有找到存档'); return; }
    loadGame();
  });

  el('btn-restart').addEventListener('click', function () {
    if (!window.confirm('确定要重新开始吗？当前进度会丢失。')) return;
    token++;
    busy = false;
    state = null;
    clearSave();
    refreshContinue();
    logEl.innerHTML = '';
    choicesEl.innerHTML = '';
    el('input-name').value = '';
    showScreen(screenStart);
  });

  el('btn-again').addEventListener('click', function () {
    token++;
    busy = false;
    state = null;
    refreshContinue();
    logEl.innerHTML = '';
    choicesEl.innerHTML = '';
    el('input-name').value = '';
    showScreen(screenStart);
  });

  /* 点击对话区跳过打字 */
  logEl.addEventListener('click', function () {
    skipFlag = true;
  });

  /* 防止移动端双击缩放 */
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

  /* ============================================================
     初始化
     ============================================================ */
  const hadLegacy = purgeLegacy();
  refreshContinue();
  if (hadLegacy) {
    setTimeout(function () { toast('旧版本存档已失效，请重新开始'); }, 500);
  }

})();
</script>
</body>
</html>
